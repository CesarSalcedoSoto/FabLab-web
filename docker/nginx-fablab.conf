# Configuración Nginx para FabLab Web
# Copiar a: /etc/nginx/sites-available/fablab
# Activar con: sudo ln -s /etc/nginx/sites-available/fablab /etc/nginx/sites-enabled/
# Verificar: sudo nginx -t
# Recargar: sudo systemctl reload nginx

# Redirección HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fablablosangeles.com;

    # Permitir validación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo el tráfico a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuración HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fablablosangeles.com;

    # Certificados SSL (Let's Encrypt)
    # Generar con: sudo certbot --nginx -d fablablosangeles.com
    ssl_certificate /etc/letsencrypt/live/fablablosangeles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fablablosangeles.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fablablosangeles.com/chain.pem;

    # Configuración SSL moderna
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/fablab-access.log;
    error_log /var/log/nginx/fablab-error.log;

    # Límites de carga (ajustar según necesidad de archivos grandes)
    client_max_body_size 50M;

    # Proxy a la aplicación Next.js en Docker
    location / {
        proxy_pass http://127.0.0.1:9011;
        proxy_http_version 1.1;

        # Headers esenciales
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (para Hot Reload en desarrollo si aplica)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Caché para fuentes e imágenes estáticas (larga duración, nombres inmutables)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:9011;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # JS y CSS: Next.js usa hashes en los nombres → cache corto por si acaso
    location ~* \.(js|css)$ {
        proxy_pass http://127.0.0.1:9011;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }
}
