# =====================================================
# Docker Compose - FabLab para Hostinger VPS
# PostgreSQL 16 + Next.js/Payload CMS + Nginx (caché)
# =====================================================
#
# Requisitos Hostinger VPS:
#   - Plan KVM 2 (2GB RAM mínimo recomendado)
#   - Ubuntu 22.04 con Docker preinstalado
#   - Puertos 80 y 443 abiertos en firewall
#
# Despliegue:
#   1. Clonar repo en el VPS:  git clone <repo> /opt/fablab
#   2. cd /opt/fablab/docker
#   3. cp .env.example .env  (editar con valores reales)
#   4. docker compose up -d --build
#
# Actualizar:
#   ./deploy.sh
#
# =====================================================

services:
  # ========================
  # PostgreSQL 16 (Alpine = menor consumo RAM)
  # ========================
  postgres:
    image: postgres:16-alpine
    container_name: fablab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fablab_blog
      POSTGRES_USER: ${POSTGRES_USER:-fablab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fablab_secret_2024}
      # Optimizar para VPS con poca RAM
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 256MB
      POSTGRES_WORK_MEM: 4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
      - ./db:/docker-entrypoint-initdb.d/dump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fablab} -d fablab_blog"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fablab-network
    # Limitar memoria en VPS pequeños
    deploy:
      resources:
        limits:
          memory: 512M

  # ========================
  # Next.js + Payload CMS
  # ========================
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgres://${POSTGRES_USER:-fablab}:${POSTGRES_PASSWORD:-fablab_secret_2024}@postgres:5432/fablab_blog
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:-fablab-payload-secret-change-me}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost}
        NEXT_PUBLIC_VESSEL_API_URL: ${NEXT_PUBLIC_VESSEL_API_URL:-}
    container_name: fablab-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fablab}:${POSTGRES_PASSWORD:-fablab_secret_2024}@postgres:5432/fablab_blog
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-fablab-payload-secret-change-me}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost}
      NEXT_PUBLIC_VESSEL_API_URL: ${NEXT_PUBLIC_VESSEL_API_URL:-}
    volumes:
      - media_data:/app/media
    expose:
      - "3000"
    networks:
      - fablab-network
    deploy:
      resources:
        limits:
          memory: 1G

  # ========================
  # Nginx - Proxy Inverso + Caché + SSL ready
  # ========================
  nginx:
    image: nginx:alpine
    container_name: fablab-nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - media_data:/app/media:ro
    networks:
      - fablab-network
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  fablab-network:
    driver: bridge
