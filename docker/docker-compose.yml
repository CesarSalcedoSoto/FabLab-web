version: '3.8'

services:
  # ========================
  # PostgreSQL Database - Puerto externo 9012, interno 5432
  # ========================
  db:
    image: postgres:16-alpine
    container_name: fablab-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fablab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fablab_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-fablab_blog}
    ports:
      - "127.0.0.1:9012:5432"
    volumes:
      - fablab-postgres-data:/var/lib/postgresql/data
    networks:
      - fablab-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================
  # WEB (Next.js + Payload) - Puerto 9011
  # ========================
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
        NEXT_PUBLIC_VESSEL_API_URL: ${NEXT_PUBLIC_VESSEL_API_URL}
        NEXT_PUBLIC_LARAVEL_URL: ${NEXT_PUBLIC_LARAVEL_URL}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    container_name: fablab-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_VESSEL_API_URL: ${NEXT_PUBLIC_VESSEL_API_URL}
      NEXT_PUBLIC_LARAVEL_URL: ${NEXT_PUBLIC_LARAVEL_URL}
      NEXT_PUBLIC_STRAPI_URL: ${NEXT_PUBLIC_STRAPI_URL}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "127.0.0.1:9011:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - web-media:/app/media
    networks:
      - fablab-network

volumes:
  fablab-postgres-data:
  web-media:

networks:
  fablab-network:
    driver: bridge
