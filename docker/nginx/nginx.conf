worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ========================
    # Optimizaciones para VPS Hostinger
    # ========================
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 15M;
    server_tokens off;

    # ========================
    # Compresión Gzip
    # ========================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ========================
    # Caché de proxy para imágenes optimizadas por Next.js
    # ========================
    proxy_cache_path /var/cache/nginx/images
        levels=1:2
        keys_zone=images_cache:10m
        max_size=1g
        inactive=30d
        use_temp_path=off;

    # ========================
    # Caché para assets estáticos Next.js
    # ========================
    proxy_cache_path /var/cache/nginx/static
        levels=1:2
        keys_zone=static_cache:10m
        max_size=500m
        inactive=7d
        use_temp_path=off;

    # ========================
    # Upstream Next.js
    # ========================
    upstream nextjs {
        server web:3000;
    }

    # ========================
    # Redirigir HTTP -> HTTPS (descomentar cuando tengas SSL)
    # ========================
    # server {
    #     listen 80;
    #     server_name tu-dominio.com www.tu-dominio.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        # listen 443 ssl http2;  # Descomentar cuando tengas SSL
        server_name _;

        # ========================
        # SSL (descomentar cuando tengas certificado)
        # Puedes usar Certbot o el SSL de Hostinger
        # ========================
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;
        # ssl_prefer_server_ciphers on;

        # ========================
        # Headers de seguridad
        # ========================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ========================
        # Archivos media (servidos directo por Nginx, sin pasar por Node)
        # ========================
        location /media/ {
            alias /app/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Cache-Status "STATIC";

            location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|pdf)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
            }
        }

        # ========================
        # Imágenes optimizadas por Next.js (_next/image)
        # ========================
        location /_next/image {
            proxy_cache images_cache;
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_cache_key "$scheme$request_uri";

            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=2592000";

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================
        # Assets estáticos de Next.js (_next/static)
        # ========================
        location /_next/static {
            proxy_cache static_cache;
            proxy_cache_valid 200 7d;

            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=604800, immutable";

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ========================
        # Archivos públicos (favicon, logos, fuentes)
        # ========================
        location ~* ^/(fonts|images)/ {
            proxy_cache static_cache;
            proxy_cache_valid 200 30d;

            add_header Cache-Control "public, max-age=2592000";

            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ========================
        # Todo lo demás -> Next.js
        # ========================
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
